
services:
  localturnero:
    build:
      context: .
      dockerfile: Dockerfile
    image: turnerolocal:local
    container_name: localturnero
    volumes:
      - ./.env:/var/www/html/.env:ro
      - ./storage:/var/www/html/storage
      - ./app:/var/www/html/app
      - ./resources:/var/www/html/resources
      - ./routes:/var/www/html/routes
      - ./config:/var/www/html/config
      - ./public:/var/www/html/public
    networks:
      - redPrincipal
    restart: always
    #QUITAR LOS PUERTOS Y LA DEPENDENCIA DE MARIADB
    ports:
      - "1212:80"
    # depends_on:
    #   - mariadb

  localturnero-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: turnerolocal:local
    container_name: localturnero-scheduler
    volumes:
      - ./.env:/var/www/html/.env:ro
      - ./storage:/var/www/html/storage
    entrypoint: ["/bin/sh", "-c", "chmod -R 777 /var/www/html/storage /var/www/html/bootstrap/cache && while true; do php /var/www/html/artisan schedule:run --no-interaction & sleep 60; done"]
    networks:
      - redPrincipal
    restart: always
    #QUITAR EL SERVICIO DE MARIA DB 
    # depends_on:
    #   - mariadb

  localturnero-queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: turnerolocal:local
    container_name: localturnero-queue-worker
    volumes:
      - ./.env:/var/www/html/.env:ro
      - ./storage:/var/www/html/storage
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /tmp/permissions_set ]; then
          chmod -R 775 /var/www/html/storage /var/www/html/bootstrap/cache
          chown -R www-data:www-data /var/www/html/storage /var/www/html/bootstrap/cache
          touch /tmp/permissions_set
        fi
        # Loop infinito para auto-reinicio
        while true; do
          php /var/www/html/artisan queue:work --verbose \
            --sleep=3 \
            --tries=3 \
            --max-time=3600 \
            --timeout=300 \
            --memory=512 \
            --queue=default,emails,notifications \
            --verbose
          echo "Worker stopped. Restarting in 5 seconds..."
          sleep 5
        done
    networks:
      - redPrincipal
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q 'queue:work' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  redPrincipal:
    external: true

